basePath: /
definitions:
  models.CategoryRequest:
    properties:
      categoryName:
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    type: object
  models.MenuResponse:
    properties:
      categoryName:
        type: string
      createdAt:
        type: string
      menuId:
        type: string
      menuImage:
        type: string
      menuNameEn:
        type: string
      menuNameLo:
        type: string
      price:
        type: number
      promotionName:
        type: string
      promotionPrice:
        type: number
      unit:
        type: string
      updatedAt:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      blocked:
        type: boolean
      createdAt:
        type: string
      createdBy:
        type: string
      firstName:
        type: string
      gender:
        type: string
      lastName:
        type: string
      passwordHash:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Lopster POS backend
  title: Lopster POS API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: login to access your account
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses: {}
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses: {}
      tags:
      - Auth
  /api/menu/create-category:
    post:
      consumes:
      - application/json
      parameters:
      - description: Create category request body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.CategoryRequest'
      produces:
      - application/json
      responses: {}
      tags:
      - Menu
  /api/menu/create-menu:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Menu name EN
        in: formData
        name: menuNameEn
        required: true
        type: string
      - description: Menu name LO
        in: formData
        name: menuNameLo
        required: true
        type: string
      - description: Category name
        in: formData
        name: categoryName
        required: true
        type: string
      - description: Price
        in: formData
        name: price
        required: true
        type: number
      - description: Unit
        in: formData
        name: unit
        required: true
        type: string
      - description: Promotion name
        in: formData
        name: promotionName
        type: string
      - description: Promotion price
        in: formData
        name: promotionPrice
        type: number
      - description: Menu image
        in: formData
        name: menuImage
        type: file
      produces:
      - application/json
      responses: {}
      summary: Create menu
      tags:
      - Menu
  /api/menu/edit-menu/{id}:
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: Menu ID
        in: path
        name: id
        required: true
        type: string
      - description: Menu name EN
        in: formData
        name: menuNameEn
        required: true
        type: string
      - description: Menu name LO
        in: formData
        name: menuNameLo
        required: true
        type: string
      - description: Category name
        in: formData
        name: categoryName
        required: true
        type: string
      - description: Price
        in: formData
        name: price
        required: true
        type: number
      - description: Unit
        in: formData
        name: unit
        required: true
        type: string
      - description: Promotion name
        in: formData
        name: promotionName
        type: string
      - description: Promotion price
        in: formData
        name: promotionPrice
        type: number
      - description: Menu image (optional, send to replace)
        in: formData
        name: menuImage
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MenuResponse'
      security:
      - BearerAuth: []
      summary: Edit menu
      tags:
      - Menu
  /api/users/get-profile:
    get:
      produces:
      - application/json
      responses: {}
      tags:
      - Users
swagger: "2.0"
